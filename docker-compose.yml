services:
  hot-dog:
    build:
      context: .
      dockerfile: Dockerfile
    image: project-hot-dog-app:latest
    pull_policy: never
    restart: unless-stopped
    ports:
      - 2121:2121
    # env_file:
      # - stack.env
    environment:
      - API_KEY=${API_KEY}
      - API_SECRET=${API_SECRET}
      - CLOUD_NAME=${CLOUD_NAME}
      - MONGO_URI=${MONGO_URI}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2121/"]
      interval: 30s
      timeout: 5s
      retries: 3
